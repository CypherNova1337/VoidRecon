# VoidRecon default configuration.
#
# Copy this to config.local.yaml (gitignored) and edit, or point --config at it.
# Environment variables override file values: VOIDRECON_<SECTION>_<KEY>.
# API keys should be supplied via the environment, never committed.

general:
  output_dir: runs
  log_level: info
  user_agent: "VoidRecon/0.1 (+https://github.com/CypherNova1337/VoidRecon)"
  # When true, a bare apex in scope (example.com) also covers its subdomains.
  wildcard_apex: true
  # Append each run to a shared SQLite DB (<output_dir>/voidrecon.db) for trends.
  sqlite: true

opsec:
  # Passive recon is always allowed. Active interaction with the target is OFF
  # unless you pass --active or set this to true. Keep it off unless you are
  # authorized to actively probe the in-scope assets.
  allow_active: false
  # Aggressive mode: active + every opt-in module + heavier throughput.
  # Prefer the --aggressive CLI flag, which also handles the confirmation prompt.
  aggressive: false
  max_concurrency: 20
  requests_per_second: 8.0
  jitter: 0.3            # randomised +/- fraction added to request spacing
  timeout: 20.0
  retries: 2
  rotate_user_agents: true
  respect_out_of_scope: true

http:
  verify_tls: true
  follow_redirects: true
  max_redirects: 5

dns:
  # Trusted resolvers used by all DNS modules. Empty/omitted uses the bundled list
  # (sourced from CypherNova1337/dns-helix). Provide a list or a file path to override.
  resolvers: []

oob:
  # Out-of-band domain you control (e.g. an interactsh domain) for blind SSRF
  # testing. VoidRecon injects unique callbacks; watch your listener for hits.
  domain: null

auth:
  # Authenticated-session material sent on every active request (crawler, fuzzer,
  # API discovery, analysis). Prefer the --header/--cookie/--bearer CLI flags.
  headers: {}   # e.g. {Authorization: "Bearer <token>", X-Api-Key: "<key>"}
  cookies: {}   # e.g. {session: "<value>"}
  # Optional scripted browser login (Playwright). Captured cookies merge into
  # 'cookies'. Selectors are auto-detected; override only if needed.
  login: {}
  #   url: https://app.example.com/login
  #   username: analyst@example.com
  #   password: "hunter2"
  #   username_selector: "#email"     # optional
  #   password_selector: "#password"  # optional
  #   submit_selector: "button[type=submit]"  # optional
  #   success_text: "Dashboard"       # optional post-login body check

modules:
  disabled: []          # module names to never run (always wins over 'enabled')
  # Force-enable opt-in modules (port_scan, crawl, tech_cve) by name.
  # "*" enables every opt-in module (aggressive mode sets this automatically).
  enabled: []
  # Per-module options, e.g.:
  # port_scan:
  #   ports: [80, 443, 8080, 8443]
  # asn_map:
  #   max_prefixes: 512      # cap announced prefixes recorded per ASN
  # crawl:
  #   depth: 2               # native crawler link depth
  #   max_pages: 250         # native crawler page budget
  # dns_brute:
  #   wordlist: /path/to/subdomains.txt   # defaults to the bundled list
  #   max_candidates: 15000               # cap resolved candidates per apex
  #   permutations: true                  # also mutate known subdomains
  # fuzz:
  #   wordlist: /path/to/paths.txt        # content-discovery paths (bundled default)
  # spa_crawl:
  #   max_origins: 40                     # cap browser-driven origins
  # origin_ip:
  #   max_candidates: 100                 # cap IPs tested for origin exposure
  # param_discovery:
  #   wordlist: /path/to/params.txt       # parameter names (bundled default)
  #   max_params: 250                     # candidates tested per endpoint
  #   max_endpoints: 40                   # endpoints tested per run

sources:
  # All optional. Prefer env vars, e.g. VOIDRECON_SOURCES_GITHUB_TOKEN=ghp_xxx
  github_token: null            # GitHub code-search dorking
  shodan_api_key: null          # favicon-hash pivoting (cross-internet asset discovery)
  securitytrails_api_key: null  # richer passive DNS
  virustotal_api_key: null      # richer passive DNS
  censys_api_id: null           # extra passive subdomain source
  censys_api_secret: null
  # HackerOne scope import reads these from the environment directly:
  #   VOIDRECON_SOURCES_HACKERONE_USERNAME, VOIDRECON_SOURCES_HACKERONE_TOKEN

intel:
  llm_enabled: false
  llm_provider: none    # none | openai | anthropic | ollama | openai_compatible
  llm_model: ""         # e.g. gpt-4o-mini, claude-3-5-sonnet, llama3.1
  llm_base_url: ""      # for ollama (http://localhost:11434) or a compatible gateway
  llm_api_key_env: VOIDRECON_LLM_API_KEY
  llm_max_assets: 60

reporting:
  formats: [json, markdown, html]

notify:
  # Optional completion notification. Prefer env: VOIDRECON_NOTIFY_WEBHOOK
  webhook: null                 # Slack or Discord webhook URL (auto-detected)
  min_severity: high            # only notify if a finding at/above this severity exists
